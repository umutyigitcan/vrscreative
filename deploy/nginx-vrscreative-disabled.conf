server {
    listen 8093;
    listen [::]:8093;
    server_name _;
    return 301 https://vrskreatif.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name vrs.187.77.86.105.sslip.io;
    return 301 https://vrskreatif.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vrs.187.77.86.105.sslip.io;

    ssl_certificate /etc/letsencrypt/live/vrs.187.77.86.105.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vrs.187.77.86.105.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vrskreatif.com$request_uri;
}

server {
