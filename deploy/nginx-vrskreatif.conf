server {
    listen 80;
    listen [::]:80;
    server_name vrskreatif.com www.vrskreatif.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/vrscreative-site;
    }

    location / {
        return 301 https://vrskreatif.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.vrskreatif.com;

    ssl_certificate /etc/letsencrypt/live/vrskreatif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vrskreatif.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vrskreatif.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vrskreatif.com;

    root /opt/vrscreative-site;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/vrskreatif.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vrskreatif.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:css|js|png|jpg|jpeg|webp|svg|ico|mp4)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
